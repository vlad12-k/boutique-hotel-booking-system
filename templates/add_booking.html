{% extends "base.html" %}

{% block content %}
<h1 class="mb-3">Create Booking</h1>
<form method="post" class="card card-body">
  <div class="mb-3">
    <label class="form-label">Guest</label>
    <select name="guest_id" class="form-select" required>
      <option value="">Select Guest</option>
      {% for guest in guests %}
      <option value="{{ guest.id }}">{{ guest.full_name }} ({{ guest.email }})</option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Room</label>
    <select name="room_id" class="form-select" required>
      <option value="">Select Room</option>
      {% for room in rooms %}
      <option value="{{ room.id }}">Room {{ room.room_number }} - {{ room.room_type }} (£{{ "%.2f"|format(room.price_per_night) }}) [{{ room.status }}]</option>
      {% endfor %}
    </select>
  </div>

  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Check-in Date</label>
      <input type="date" name="check_in_date" class="form-control" required>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Check-out Date</label>
      <input type="date" name="check_out_date" class="form-control" required>
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label">Initial Booking Status</label>
    <select name="status" class="form-select">
      {% for status in booking_statuses %}
      {% if status in ['Pending', 'Confirmed'] %}
      <option value="{{ status }}" {% if status == 'Confirmed' %}selected{% endif %}>{{ status }}</option>
      {% endif %}
      {% endfor %}
    </select>
  </div>

  <button class="btn btn-primary" type="submit">Create Booking</button>
</form>
{% endblock %}
