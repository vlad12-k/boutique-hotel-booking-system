{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1>Guests</h1>
  <a href="{{ url_for('add_guest') }}" class="btn btn-primary">Add Guest</a>
</div>

<div class="table-responsive">
  <table class="table table-bordered align-middle">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody>
      {% for guest in guests %}
      <tr>
        <td>{{ guest.full_name }}</td>
        <td>{{ guest.email }}</td>
        <td>{{ guest.phone }}</td>
        <td>{{ guest.notes or '-' }}</td>
      </tr>
      {% else %}
      <tr><td colspan="4" class="text-center text-muted">No guests found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
