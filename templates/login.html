{% extends "base.html" %}

{% block title %}Sign in · Haifa Guest House Operations{% endblock %}

{% block content %}
<div class="row justify-content-center py-4 py-lg-5">
  <div class="col-12 col-sm-10 col-md-7 col-lg-5">
    <div class="card card-body shadow-sm form-panel p-4">
      <div class="mb-4">
        <p class="text-uppercase small text-muted fw-semibold mb-2">Owner operations</p>
        <h1 class="h3 mb-2">Sign in</h1>
        <p class="text-muted mb-0">Use your staff account to access hotel operations.</p>
      </div>

      <form method="post" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if next_url %}
          <input type="hidden" name="next" value="{{ next_url }}">
        {% endif %}

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            autocomplete="username"
            maxlength="254"
            required
            autofocus
          >
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            autocomplete="current-password"
            maxlength="128"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary w-100">Sign in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
